openapi: 3.1.0
info:
  title: 001 로그인
  version: 0.1.0
  description: >
    로그인, 로그아웃, 내 정보, 표시 이름 수정, 탈퇴의 계약입니다.
    형식과 권한 표기는 docs/architecture/api-conventions.md를 따릅니다.
    상태를 바꾸는 요청(POST, PATCH, DELETE)은 Origin 헤더가 서비스 주소와 같아야 합니다. Origin이 없으면 Referer의 출처로 확인하고,
    둘 다 없거나 다르면 403 ORIGIN_REJECTED입니다. 이 검사는 로그인 상태 확인(401) 뒤에 합니다.
    화면 경로(HTML과 정적 파일)는 로그인 없이 받지만 개인 자료가 없고, 자료는 /api/v1 아래로만 받습니다.
paths:
  /oauth2/authorization/google:
    get:
      summary: 로그인 시작 요청
      description: >
        구글 로그인 화면으로 보냅니다. 모든 요청에 prompt=select_account, state, nonce, PKCE(S256)를 붙이고,
        로그인 임시 값을 __Host-Http-login 쿠키(10분, HttpOnly, Secure, SameSite=Lax, Path=/)에 담습니다.
        세션 쿠키가 있으면 옛 세션 참조와 목적을 함께 담습니다. 세션은 만들지 않고, 있는 세션은 마지막 접근 시각만 갱신됩니다.
        returnTo는 %가 없고 출력 가능한 ASCII인 서비스 안 경로만 받습니다.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: 로그인 뒤 돌아갈 서비스 안 경로. 결정 기록 0013의 조건을 어기면 무시하고 / 로 보냅니다.
          schema:
            type: string
            examples: ["/withdraw"]
        - name: purpose
          in: query
          required: false
          description: reauth면 재인증입니다. 없으면 일반 로그인입니다.
          schema:
            type: string
            enum: [reauth]
      responses:
        "302":
          description: 구글 인가 주소로 이동합니다.
  /login/oauth2/code/google:
    get:
      summary: 콜백 요청
      description: >
        구글에서 돌아오는 최상위 이동입니다. state와 시작 시각(10분)과 ID 토큰을 확인하고 임시 값 쿠키를 지웁니다.
        성공하면 새 세션을 발급하고(__Host-Http-session) 돌아갈 경로로 보냅니다.
        재인증은 ID 토큰의 sub가 옛 세션의 사용자와 같고 옛 세션이 유효할 때만 성공합니다.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: >
            성공하면 돌아갈 경로(없으면 /)로, 로그인 실패는 /login-failed로,
            재인증 실패는 /reauth-failed로, 다른 계정으로 한 재인증은 /reauth-failed?reason=account-mismatch로 이동합니다.
  /api/v1/me:
    get:
      summary: 내 정보 조회
      security:
        - sessionCookie: []
      x-permission: none
      x-household-scope: false
      x-owner-only: false
      x-reauth: false
      responses:
        "200":
          description: 로그인한 사용자 본인의 정보입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      summary: 표시 이름 수정
      security:
        - sessionCookie: []
      x-permission: profile:write
      x-household-scope: false
      x-owner-only: true
      x-reauth: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMe"
      responses:
        "200":
          description: 고친 뒤의 내 정보입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: 표시 이름이 비었거나 20자를 넘었거나 제어 문자, 줄 구분 문자, 방향 제어 문자가 있습니다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://example.com/problems/validation-failed
                title: 입력값이 올바르지 않습니다
                status: 400
                detail: 입력값 하나를 확인해 주세요.
                code: VALIDATION_FAILED
                errors:
                  - pointer: "#/displayName"
                    detail: 표시 이름은 1자 이상 20자 이하로 입력해 주세요.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginRejected"
    delete:
      summary: 탈퇴
      description: >
        사용자 행을 잠근 뒤 그 사용자의 모든 세션 행과 사용자 행을 한 트랜잭션에서 지웁니다.
        로그인 상태 확인(401)을 재인증 확인(401 REAUTH_REQUIRED)보다 먼저 합니다.
        멤버십이 있으면 409로 거절하는 규칙은 002가 붙입니다.
      security:
        - sessionCookie: []
      x-permission: none
      x-household-scope: false
      x-owner-only: false
      x-reauth: true
      responses:
        "204":
          description: 탈퇴했습니다. 세션 쿠키를 지웁니다.
        "401":
          description: 로그인 상태가 없거나(UNAUTHENTICATED) 마지막 구글 인증이 5분보다 오래됐습니다(REAUTH_REQUIRED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unauthenticated:
                  value:
                    type: https://example.com/problems/unauthenticated
                    title: 로그인이 필요합니다
                    status: 401
                    detail: 다시 로그인해 주세요.
                    code: UNAUTHENTICATED
                reauthRequired:
                  value:
                    type: https://example.com/problems/reauth-required
                    title: 구글 계정 확인이 필요합니다
                    status: 401
                    detail: 구글 계정을 한 번 더 확인한 뒤 다시 시도해 주세요.
                    code: REAUTH_REQUIRED
        "403":
          $ref: "#/components/responses/OriginRejected"
  /api/v1/logout:
    post:
      summary: 로그아웃
      description: 로그인 상태를 확인한 뒤 이 기기의 세션 행만 지우고 세션 쿠키를 지웁니다. GET으로는 로그아웃하지 않습니다.
      security:
        - sessionCookie: []
      x-permission: none
      x-household-scope: false
      x-owner-only: false
      x-reauth: false
      responses:
        "204":
          description: 로그아웃했습니다.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginRejected"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-Http-session
  schemas:
    Me:
      type: object
      required: [displayName, loginEmail, emailVerified]
      properties:
        displayName:
          type: [string, "null"]
          description: 첫 로그인에서 구글이 보낸 이름을 다듬은 뒤 쓸 수 있는 이름이 없으면 null입니다.
          examples: ["엄마"]
        loginEmail:
          type: string
          format: email
          examples: ["user1@example.com"]
        emailVerified:
          type: boolean
    UpdateMe:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: 앞뒤 공백을 지운 뒤 1자 이상 20자 이하(코드 포인트), 제어 문자, 줄 구분 문자, 방향 제어 문자(U+202A~U+202E, U+2066~U+2069) 없음.
          examples: ["아빠"]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [UNAUTHENTICATED, REAUTH_REQUIRED, VALIDATION_FAILED, ORIGIN_REJECTED]
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer:
                type: string
              detail:
                type: string
  responses:
    Unauthenticated:
      description: 로그인 상태가 없거나 만료되었습니다.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.com/problems/unauthenticated
            title: 로그인이 필요합니다
            status: 401
            detail: 다시 로그인해 주세요.
            code: UNAUTHENTICATED
    OriginRejected:
      description: 상태를 바꾸는 요청의 Origin(없으면 Referer)이 서비스 주소가 아닙니다.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.com/problems/origin-rejected
            title: 허용하지 않은 요청입니다
            status: 403
            detail: 서비스 화면에서 다시 시도해 주세요.
            code: ORIGIN_REJECTED
