                code: NO_HOUSEHOLD
            permissionDenied:
              value:
                type: https://example.com/problems/permission-denied
                title: 할 수 없는 동작입니다
                status: 403
                detail: 이 가구에서 할 수 없는 동작입니다.
                code: PERMISSION_DENIED
    ForbiddenRead:
      description: >
        상태를 바꾸지 않는 요청(GET)의 403입니다. Origin 검사를 받지 않으므로 멤버십이 없거나(NO_HOUSEHOLD) 역할에 권한 키가 없습니다(PERMISSION_DENIED).
      content:
        application/problem+json:
          schema:
