    Forbidden:
      description: >
        Origin이 다르거나(ORIGIN_REJECTED), 멤버십이 없거나(NO_HOUSEHOLD), 역할에 권한 키가 없거나 자기 자신을 제거하려 합니다(PERMISSION_DENIED).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            originRejected:
              value:
                type: https://example.com/problems/origin-rejected
                title: 허용하지 않은 요청입니다
                status: 403
                detail: 서비스 화면에서 다시 시도해 주세요.
                code: ORIGIN_REJECTED
            noHousehold:
              value:
                type: https://example.com/problems/no-household
