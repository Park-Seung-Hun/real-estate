services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: estate
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # Playwright e2e에서만 쓰는 가짜 구글 서버
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.0
    profiles: ["e2e"]
    ports:
      - "127.0.0.1:9090:8080"

volumes:
  postgres-data:
