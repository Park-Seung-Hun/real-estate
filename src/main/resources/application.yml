spring:
  application:
    name: estate
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 만들고, Hibernate는 엔티티와 어긋나는지 검증만 한다
      ddl-auto: validate
  jackson:
    deserialization:
      # 알 수 없는 필드를 거절해 PATCH /api/v1/me로 이메일 같은 다른 필드를 보내도 무시되지 않게 한다
      fail-on-unknown-properties: true
  datasource:
    hikari:
      data-source-properties:
        # 유니크 위반 같은 서버 오류의 Detail(키 값, 예: 구글 sub)이 예외 메시지와 Hibernate 경고 로그에 실리지 않게 한다
        logServerErrorDetail: false
  session:
    timeout: 7d
    jdbc:
      # 테이블은 Flyway가 만든다
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

estate:
  oidc:
    allowed-issuers:
      - https://accounts.google.com
      - accounts.google.com
  collector:
    # 쉼표로 여러 지역(시군구 코드 5자리). 비우면 수집하지 않는다
    regions: ${ESTATE_COLLECTOR_REGIONS:}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    cron: ${ESTATE_COLLECTOR_CRON:0 0 9 * * *}
    base-url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev
    daily-call-limit: 10000
    self-stop-margin: 500
    connect-timeout: 5s
    read-timeout: 30s
    raw:
      endpoint: ${ESTATE_RAW_S3_ENDPOINT:}
      region: ${ESTATE_RAW_S3_REGION:}
      bucket: ${ESTATE_RAW_S3_BUCKET:}
      access-key: ${ESTATE_RAW_S3_ACCESS_KEY:}
      secret-key: ${ESTATE_RAW_S3_SECRET_KEY:}
