spring:
  application:
    name: estate
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 만들고, Hibernate는 엔티티와 어긋나는지 검증만 한다
      ddl-auto: validate
  session:
    timeout: 7d
    jdbc:
      # 테이블은 Flyway가 만든다
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

estate:
  oidc:
    allowed-issuers:
      - https://accounts.google.com
      - accounts.google.com
